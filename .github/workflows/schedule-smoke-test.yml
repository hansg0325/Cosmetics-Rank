name: Schedule smoke test

on:
  schedule:
    # One-time test: 2026-11-10 21:50 Asia/Seoul (12:50 UTC).
    - cron: '50 12 10 11 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log-scheduled-run:
    runs-on: [self-hosted, windows, x64, cosmetics-rank]
    timeout-minutes: 5
    steps:
      - name: Print success marker
        shell: cmd
        run: |
          echo SCHEDULE_TEST_OK
          echo The scheduled workflow ran successfully.
          echo Runner: %RUNNER_NAME%
          echo Event: %GITHUB_EVENT_NAME%
          echo Local time: %DATE% %TIME%
