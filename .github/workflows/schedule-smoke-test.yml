name: Schedule smoke test

on:
  schedule:
    # One-time test: 2026-11-10 10:10 Asia/Seoul (01:10 UTC).
    - cron: '10 1 10 11 *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log-scheduled-run:
    runs-on: [self-hosted, windows, x64, cosmetics-rank]
    timeout-minutes: 5
    steps:
      - name: Print success marker
        shell: pwsh
        run: |
          Write-Output "SCHEDULE_TEST_OK"
          Write-Output "The scheduled workflow ran successfully."
          Write-Output "Runner: $env:RUNNER_NAME"
          Write-Output "Event: $env:GITHUB_EVENT_NAME"
