name: Hosted collector test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-collector-test
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record actual trigger and runner
        run: |
          echo "event=$GITHUB_EVENT_NAME runner=$RUNNER_ENVIRONMENT utc=$(date -u +%FT%TZ)"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-selenium.txt
      - name: Read overall top 100 and product details without database writes
        run: python scripts/probe-selenium.py --target overall --output data/hosted-probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-probe
          path: data/hosted-probe.json
          retention-days: 1
