name: Temporary schedule trigger probe

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: [.github/workflows/schedule-trigger-probe.yml]

permissions:
  contents: read

jobs:
  log-event:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log triggering event
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          echo SCHEDULE_PROBE_OK
          printf 'Event: %s\nCron: %s\n' "$GITHUB_EVENT_NAME" "$SCHEDULE_CRON"
          date -u '+UTC time: %Y-%m-%dT%H:%M:%SZ'
