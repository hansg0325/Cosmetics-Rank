name: Daily ranking collection
on:
  workflow_dispatch:
    inputs:
      category:
        description: Category to collect for a manual diagnostic run
        required: true
        type: choice
        default: skincare
        options:
          - all
          - overall
          - skincare
          - maskpack
          - cleansing
          - suncare
          - makeup
          - dermocosmetics
          - haircare
          - bodycare
          - mens_edit
permissions:
  contents: read
concurrency:
  group: daily-ranking-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: [self-hosted, windows, x64, cosmetics-rank]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-selenium.txt
      - name: Collect and save all categories
        env:
          COLLECTION_ORIGIN: https://cosmetics-rank.hansg0325.workers.dev
          COLLECTION_API_KEY: ${{ secrets.COLLECTION_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          COLLECTION_CATEGORY: ${{ github.event_name == 'schedule' && 'all' || inputs.category || 'all' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/daily-collection.py
